<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Oswald;src:url(Oswald.ttf);font-weight:200 700}
@font-face{font-family:Manrope;src:url(Manrope.ttf);font-weight:200 800}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;background:
 radial-gradient(900px 500px at 50% -5%, #1c3a2e 0%, rgba(28,58,46,0) 70%),
 repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 2px, transparent 2px 14px), #0c0e0d;
 color:#f1ede2;font-family:Manrope;position:relative;overflow:hidden}
.p{position:absolute;border-radius:50%;background:#d9a441;opacity:.35}
.t1{position:absolute;top:210px;width:100%;text-align:center;font-family:Oswald;font-weight:700;font-size:64px;letter-spacing:.06em;text-transform:uppercase}
.t2{position:absolute;top:290px;width:100%;text-align:center;font-family:Oswald;font-weight:700;font-size:118px;color:#e2655a;letter-spacing:.02em}
.card{position:absolute;left:140px;top:500px;width:800px;background:#141a17;border:2px solid #243029;border-radius:36px;padding:44px}
.row{display:flex;align-items:center;gap:32px}
.av{width:170px;height:170px;border-radius:28px;background:#1b211e;border:2px solid #2a3a33;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.nm{font-family:Oswald;font-size:44px;font-weight:700;letter-spacing:.04em}
.tag{display:inline-block;margin-top:10px;padding:6px 18px;border-radius:999px;background:#3a2a08;color:#d9a441;font-family:Oswald;font-size:26px;letter-spacing:.12em}
.lutas{margin-top:40px;display:grid;gap:18px}
.l{display:flex;justify-content:space-between;background:#121815;border:1px solid #243029;border-radius:20px;padding:22px 28px;font-size:34px}
.pos{color:#7fd1a3;font-family:Oswald;font-weight:700}.neg{color:#e2655a;font-family:Oswald;font-weight:700}
.meta{margin-top:40px;position:relative;height:120px}
.bar{position:absolute;left:0;right:0;top:50px;height:34px;border-radius:17px;background:#1b211e;border:1px solid #243029}
.fill{position:absolute;left:0;top:50px;height:34px;border-radius:17px;background:#e2655a;width:44%}
.goal{position:absolute;left:calc(100% - 8px);top:30px;height:74px;width:6px;background:#d9a441;border-radius:3px}
.lab{position:absolute;top:0;font-family:Oswald;font-size:28px;letter-spacing:.08em;color:#93a39a}
.preco{margin-top:30px;display:flex;justify-content:space-between;align-items:baseline;font-family:Oswald}
.big{font-size:84px;font-weight:700}
.you{position:absolute;left:140px;top:1420px;width:800px;border-radius:36px;padding:40px;background:#2a1412;border:2px solid #5a2622;text-align:center}
.you .a{font-family:Oswald;letter-spacing:.14em;color:#ef8d83;font-size:32px}
.you .b{font-family:Oswald;font-weight:700;font-size:130px;color:#e2655a;line-height:1.05}
.logo{position:absolute;bottom:70px;width:100%;text-align:center;font-family:Oswald;font-weight:700;font-size:34px;letter-spacing:.08em}
</style></head><body>
<div class="p" style="width:8px;height:8px;left:120px;top:160px"></div><div class="p" style="width:5px;height:5px;left:900px;top:420px"></div><div class="p" style="width:6px;height:6px;left:980px;top:1300px"></div><div class="p" style="width:4px;height:4px;left:70px;top:1100px"></div>
<div class="t1">The favorite dropped</div><div class="t2">AND YOU PAID</div>
<div class="card">
 <div class="row">
  <div class="av"><svg width="150" height="150" viewBox="0 0 100 100"><path d="M18,100 L22,48 C24,34 36,28 50,28 C64,28 76,34 78,48 L82,100 Z" fill="#f6f3ea"/><circle cx="50" cy="20" r="14" fill="#2a3a33"/><text x="50" y="72" text-anchor="middle" font-family="Oswald" font-weight="700" font-size="26" fill="#1b211e">8</text><text x="50" y="88" text-anchor="middle" font-family="Oswald" font-size="11" fill="#1b211e">JPN</text></svg></div>
  <div><div class="nm">KENTA MORITA</div><div class="tag">FAVORITE · 18 JC · −73 KG</div></div>
 </div>
 <div class="lutas">
  <div class="l"><span>Fight 1 · ippon</span><span class="pos">+10</span></div>
  <div class="l"><span>Fight 2 · conceded waza-ari</span><span class="neg">−2</span></div>
 </div>
 <div class="meta"><div class="lab" style="left:0">SCORED 8</div><div class="lab" style="right:14px;color:#d9a441">TARGET = PRICE 18</div><div class="bar"></div><div class="fill"></div><div class="goal"></div></div>
 <div class="preco"><span style="color:#93a39a;font-size:34px;letter-spacing:.08em">PRICE</span><span class="big">18 <span style="color:#93a39a;font-size:54px">→</span> <span style="color:#e2655a">13 JC ▼</span></span></div>
</div>
<div class="you"><div class="a">YOUR JUDOCOINS</div><div class="b">−5 JC</div></div>
<div class="logo"><span style="display:inline-block;width:34px;height:34px;border-radius:50%;background:#d9a441;vertical-align:-6px;margin-right:12px;position:relative"><span style="position:absolute;left:8px;top:14px;width:18px;height:6px;border-radius:2px;background:#1b211e"></span></span>IPPON <span style="color:#8fbef0">LEAGUE</span></div>
</body></html>
