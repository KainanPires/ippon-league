# Build ASSINADA da app iPhone + envio para o TestFlight (App Store Connect).
#
# Como disparar: alterar mobile/ios-release.txt no ramo mobile (ex.: anotar a
# build nova), ou "Run workflow" no separador Actions (quando este ficheiro
# estiver no main).
#
# Segredos usados (GitHub → Settings → Secrets → Actions), NUNCA neste ficheiro:
#   ASC_KEY_ID      Key ID da chave da App Store Connect
#   ASC_ISSUER_ID   Issuer ID
#   ASC_KEY_P8      conteúdo completo do ficheiro AuthKey_XXXX.p8
# A assinatura é automática (certificado gerido pela Apple na nuvem); não há
# certificados nem perfis guardados no repositório.
name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [mobile]
    paths:
      - "mobile/ios-release.txt"

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      TEAM_ID: SBK6UC9337
      # Número de build único e crescente (a Apple rejeita números repetidos).
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Versões
        run: xcodebuild -version && node -v

      - name: Verificar segredos (sem os mostrar)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          falta=0
          [ -n "$ASC_KEY_ID" ]    || { echo "Falta o segredo ASC_KEY_ID"; falta=1; }
          [ -n "$ASC_ISSUER_ID" ] || { echo "Falta o segredo ASC_ISSUER_ID"; falta=1; }
          [ -n "$ASC_KEY_P8" ]    || { echo "Falta o segredo ASC_KEY_P8"; falta=1; }
          printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY" || { echo "ASC_KEY_P8 não parece um ficheiro .p8 completo"; falta=1; }
          exit $falta

      - name: Escrever chave temporária
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Dependências
        run: npm ci --no-audit --no-fund

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Archive (Release, assinado)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath ios/DerivedData \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive

      - name: Exportar e enviar para a App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Enviado: versão 1.0.0, build $BUILD_NUMBER"

      - name: Apagar chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
